# =====================================================================
# 🏡 工业级 Nav2 终极配置文件 (Humble - 稳定探索版)
# =====================================================================

amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"
    max_particles: 3000
    min_particles: 500
    pf_err: 0.05
    pf_z: 0.99
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    scan_topic: /scan_filtered  
    laser_max_range: 12.0
    laser_min_range: 0.15
    set_initial_pose: True
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: "" 

bt_navigator:
  ros__parameters:
    use_sim_time: False
    # Jetson 上 100 Hz 行为树循环会持续超期并与控制/EKF争用 CPU；50 Hz 足够。
    bt_loop_duration: 20
    # A 20 ms action/service acknowledgement deadline caused FollowPath,
    # Wait, and costmap-clear retries to abort while a person blocked the
    # route. This only extends the high-level BT response deadline; the
    # controller and collision monitor still stop immediately for obstacles.
    default_server_timeout: 500
    global_frame: map
    robot_base_frame: base_footprint
    # 行为树应使用 EKF 发布的连续机体速度，而不是未经融合的轮式里程计。
    odom_topic: /odometry/filtered
    # navigation.launch.py 会把下面两个占位值改写成包内绝对路径。
    # Humble 官方树的 FollowPath 不填写 goal_checker_id；加载第二个
    # explore_goal_checker 后空名称会成为非法值，继而误触发 Spin/Wait/BackUp。
    # 自定义树仅补上 general_goal_checker，官方恢复结构和运动参数不变。
    default_nav_to_pose_bt_xml: ""
    default_nav_through_poses_bt_xml: ""

behavior_server:
  ros__parameters:
    use_sim_time: False
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    # Humble 的 Spin 从 behavior_server 顶层读取这些参数。
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.25
    min_rotational_vel: 0.10
    rotational_acc_lim: 0.20
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 1.0 

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 10
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    # Couple linear/angular increments so ramping does not bend the desired arc.
    scale_velocities: True
    feedback: "OPEN_LOOP"
    # 20 Hz 输出更细的速度台阶；加减速限制仍沿用已验证值。
    max_velocity: [0.30, 0.0, 0.35]
    min_velocity: [-0.15, 0.0, -0.35]
    max_accel: [0.20, 0.0, 0.30]
    max_decel: [-0.5, 0.0, -0.8]      
    odom_topic: "/odometry/filtered"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.25

# =====================================================================
# 🧠 规划器与控制器服务器
# =====================================================================
planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    use_sim_time: False
    # 默认行为树仍显式选择 GridBased。LuckGrid 只在 navigation_profile:=luck_full
    # 的试验树中使用，因此加载插件不会改变现有 Smac2D 稳定基线。
    planner_plugins: ["GridBased", "LuckGrid"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      # 手动导航稳定基线：允许规划器在请求点附近寻找可达终点。
      tolerance: 0.35
      downsample_costmap: false
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
    LuckGrid:
      plugin: "luckrobot_nav2_plugins/LuckPlanner"
      tolerance: 0.35
      allow_unknown: true
      max_planning_cost: 252
      # V11.5：提高软代价权重，使路径在仍可通行的窄处尽量居中。
      cost_penalty: 5.0
      # 将方向作为搜索状态，抑制连续锯齿换向。
      turn_penalty: 0.20
      # V11.5：实测停止点的中心代价仅 153/173，但预测 footprint 已撞到
      # 254。收紧直视化简阈值，避免平滑后的长线段切过拐角内侧。
      smoothing_max_cost: 100
      interpolation_resolution: 0.05
      max_iterations: 1000000
      # V12.13: periodic replanning may discover a high obstacle and choose a
      # safe detour. Keep that detour while it remains traversable instead of
      # switching back to a temporarily shorter route when the forward camera
      # turns away. A newly occupied cell still invalidates it immediately.
      route_hysteresis_enabled: true
      route_reuse_goal_tolerance: 0.15
      route_reuse_goal_yaw_tolerance: 0.35
      route_reuse_start_tolerance: 0.45

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 10.0
    # RPP 在 Humble 中用该里程计的当前角速度执行加速度限幅。若保持
    # 默认 /odom（本车没有发布），每个周期都会从 0 重新限到 0.02 rad/s。
    odom_topic: /odometry/filtered
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker", "explore_goal_checker"]
    # FollowPath 是已经实车验收的 RPP；LuckFollowPath 只在显式试验档使用。
    controller_plugins: ["FollowPath", "LuckFollowPath"]

    progress_checker:
      # 差速车的大角度掉头也是有效进展。SimpleProgressChecker 只看 XY，
      # 实车 180° 返回测试在持续转动时恰好 35 s 被误判为无进展。
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.05
      required_movement_angle: 0.20
      movement_time_allowance: 35.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # 实车 A/B 验证：0.15 m / 0.15 rad 会在约 10 cm、8 deg 误差时提前成功。
      # 0.08 m / 0.10 rad 可稳定完成精修，同时避免在低速区反复摆动。
      xy_goal_tolerance: 0.08
      yaw_goal_tolerance: 0.10

    # 仅由自动探索的专用行为树显式选择。0.85m 分段是“路过点”而不是
    # 需要原地精修朝向的最终任务点；忽略最终 yaw 可消除实测每段最多
    # 11.5 秒的纯自转。RViz 手动导航仍使用上面的 8cm / 0.10rad 基线。
    explore_goal_checker:
      stateful: False
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 3.14

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.30       
      lookahead_dist: 0.35            
      min_lookahead_dist: 0.15
      max_lookahead_dist: 0.45
      lookahead_time: 1.0 
      rotate_to_heading_angular_vel: 0.25
      transform_tolerance: 1.0 
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.02 
      # 实车长直线A/B：0.20m时轮速滞后最多造成约5.5cm末段前移；
      # 0.35m提前降速后降至约2.6cm，且2m目标最终误差约4.6cm。
      approach_velocity_scaling_dist: 0.35
      use_collision_detection: true 
      max_allowed_time_to_collision_up_to_carrot: 1.0 
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      # 与下方局部膨胀半径同步缩至 0.25 m；该值不得大于局部膨胀半径。
      cost_scaling_dist: 0.25
      cost_scaling_gain: 1.0
      # 必须与 local_costmap.inflation_layer.cost_scaling_factor 一致。
      inflation_cost_scaling_factor: 20.0
      # Humble 默认 0.25，高于本车 0.15 的极速，会让调节功能完全失效。
      regulated_linear_scaling_min_speed: 0.05
      regulated_linear_scaling_min_radius: 0.70
      use_rotate_to_heading: true
      # V10.6 将该阈值收紧到 0.22 rad 后，实车窄通道包的第 2 个目标仅
      # 平移约 0.64 m，却累计旋转约 640 deg，并出现 12 次角速度换向。
      # 恢复已验证的 0.35 rad（约 20 deg），减少动态重规划时在
      # “原地对准 / 连续曲率跟踪”之间反复切换；小角度误差仍由 RPP 边走边修正。
      rotate_to_heading_min_angle: 0.35
      max_angular_accel: 0.20
      allow_reversing: false

    LuckFollowPath:
      plugin: "luckrobot_nav2_plugins/LuckController"
      use_corner_speed_preview: true
      desired_linear_vel: 0.30
      min_linear_vel: 0.03
      max_angular_vel: 0.35
      rotate_angular_vel: 0.25
      # 兼容旧配置保留；当前禁止最低转速覆盖刹停包络。
      min_rotate_angular_vel: 0.08
      lookahead_dist: 0.40
      # 2026-10-24 190648: small straight-line corrections; soften only the
      # normal lookahead. Tight-corner minimum remains .16 m below.
      # V11.8：直线仍使用 0.35 m；当近端与远端路径方向不一致时，连续缩短
      # 到 0.12 m，避免 Pure Pursuit 跨过近端急弯后抄近路撞向内侧障碍物。
      # V12.13.1：322 s 实车包显示，0.12 m 短前视会放大缓存路线入口处的
      # 横向小误差，单向弯路也出现稳定左右换向。离线按真实 TF/路径重算后，
      # 0.16 m 可减少约 19% 的普通跟踪换向，同时仍显著短于直线 0.35 m，
      # 完整 footprint 预测与局部避障继续阻止切角碰撞。
      corner_lookahead_dist: 0.16
      corner_lookahead_start_angle: 0.20
      corner_lookahead_full_angle: 0.45
      # 提速后提前减速，避免在终点附近由底盘轮速滞后造成过冲。
      approach_dist: 0.50
      # 必须不大于 GoalChecker 的 0.08 m，否则会提前停止平移并永久到不了点。
      goal_rotate_dist: 0.08
      goal_position_tolerance: 0.08
      goal_yaw_tolerance: 0.10
      # 起步大角度才进入原地转向；8.6°退出，形成迟滞带。
      rotate_enter_angle: 0.45
      rotate_exit_angle: 0.15
      # 已经在移动时，小于约46°的偏差使用 v+w 连续修正，不停车切换。
      hard_rotate_angle: 0.80
      rotate_gain: 1.0
      # 保守转动减速度用于提前制动和带执行滞后的轨迹预测；不是电机标定值。
      # 刹停目标设在退出容差内，避免在切换边界前渐近停止。
      rotate_braking_decel: 0.20
      # 2026-10-23: include command/actuator response in braking envelopes.
      # Conservative model assumptions, not measured motor specifications.
      motion_response_delay: 0.25
      linear_braking_decel: 0.35
      steering_preview_time: 0.20
      steering_correction_limit: 0.08
      # V11.6：Pure Pursuit 已经通过实际前视点曲率闭环修正航向。禁用未来路径
      # 线段切向附加项，避免动态重规划的拐角切向与当前前视点分处两侧时反打。
      path_heading_gain: 0.0
      curvature_speed_gain: 1.0
      cost_speed_gain: 0.55
      min_cost_speed_scale: 0.40
      # 角加/减速由下游 velocity_smoother 统一处理，避免串联限幅造成反向滞后。
      max_angular_accel: 0.0
      max_angular_decel: 0.80
      transform_tolerance: 1.0
      # 先验证原始指令；若会碰撞，再在 1.5 s 窗口内滚动评价
      # 3 组线速度 x 7 组角速度；所有前进弧均失败时先尝试经过 footprint
      # 碰撞验证的低速原地松角，仍无解才允许严格受限的安全短倒退。
      collision_horizon: 1.5
      use_collision_detection: true
      use_local_avoidance: true
      # 允许 footprint 外缘经过高膨胀带，但正常轨迹的机器人中心不得进入
      # 253 内切区；若启动时已经在 253，只允许真实退出该区域的速度弧线。
      max_trajectory_center_cost: 252
      avoidance_angular_span: 0.45
      avoidance_angular_samples: 7
      avoidance_min_linear_scale: 0.35
      # 候选轨迹评分：首先贴合当前路径/前视点，其次远离高代价区域，
      # 同时抑制左右反复换向与不必要降速。
      avoidance_path_weight: 2.5
      avoidance_heading_weight: 0.60
      avoidance_cost_weight: 0.80
      avoidance_smoothness_weight: 0.35
      avoidance_speed_weight: 0.50
      # 不再只比较被起点高代价支配的 max footprint；显式奖励轨迹末端
      # 进入更低中心代价，防止避障采样器选择朝障碍物更近的一侧。
      avoidance_clearance_weight: 2.0
      avoidance_switch_penalty: 0.40
      avoidance_side_hold_time: 2.0
      # 仅在所有前进弧和扫掠原地转向都失败时启用：4 cm/s、每个导航目标
      # 累计最多 3 s（名义约 12 cm，非实测位移上限）；整段 footprint 安全且中心代价至少下降 2
      # 才会输出。Collision Monitor 仍在下游做独立最终拦截。
      reverse_escape_linear_vel: 0.04
      reverse_escape_angular_vel: 0.12
      reverse_escape_timeout: 3.0
      reverse_escape_min_cost_drop: 2.0
      # 动态行人短时挡路先停车等候；5 s 内仍没有任何安全速度弧线，
      # 才结束本次 FollowPath，由自定义“安静恢复树”清图并重规划。
      obstacle_wait_timeout: 1.5
      obstacle_failure_timeout: 5.0
      # V11.7.1：正常轨迹有效、控制器持续给出非零速度，但融合里程计连续
      # 3 s 仍静止时，主动结束当前 FollowPath，让行为树清图并重新规划。
      # 纯原地转向使用独立的 6 s 窗口：实车可能在破静摩擦过程中
      # 出现短暂起步、停顿和再起步，3 s 会误伤原有恢复能力。
      # 两者都不会改变正常速度输出。
      execution_stall_timeout: 3.0
      execution_rotation_stall_timeout: 6.0
      # V12.11：轮端在约 5~6 RPM 时可能报告旋转，但实车仍未克服静摩擦。
      # 若 IMU 连续 0.6 s 证明车体没有转动，短暂提升到已经验收的 0.35
      # rad/s 上限；一旦真实转动便恢复原 0.25 rad/s 与原制动包络。
      rotation_breakaway_delay: 0.60
      rotation_breakaway_angular_vel: 0.35
      # 仅供“指令是否到达执行器”的监测使用；控制与定位仍使用
      # /odometry/filtered。平移仍参考轮速；纯原地转向必须由 IMU 证明车体
      # 确实旋转，不能再把电机轴/编码器进展当作整车转动。
      execution_feedback_odom_topic: /wheel/odom
      execution_feedback_imu_topic: /imu/data
      execution_feedback_timeout: 0.50
      motion_command_linear_threshold: 0.03
      motion_command_angular_threshold: 0.05
      motion_feedback_linear_threshold: 0.01
      motion_feedback_angular_threshold: 0.03
# =====================================================================
# 🗺️ 全局代价地图
# =====================================================================
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      transform_tolerance: 1.0  
      robot_radius: 0.175     
      resolution: 0.05
      track_unknown_space: true
      # V12.13: lidar and height camera are independent physical planes. They
      # must contribute separate obstacle layers so a low lidar clearing ray
      # cannot erase an overhang that only the camera can see. The master
      # costmap merges both layers by maximum cost before inflation/planning.
      plugins: ["static_layer", "lidar_obstacle_layer", "camera_obstacle_layer", "inflation_layer"]
      lidar_obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        combination_method: 1
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.15
          obstacle_max_range: 10.0
          obstacle_min_range: 0.15
      camera_obstacle_layer:
        plugin: "luckrobot_nav2_plugins::PersistentCameraLayer"
        enabled: True
        combination_method: 1
        observation_sources: camera camera_clear
        camera_clear:
          topic: /scan_camera_clear
          data_type: "LaserScan"
          clearing: True
          marking: False
          inf_is_valid: False
          observation_persistence: 0.0
          max_obstacle_height: 2.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.25
        camera:
          topic: /scan_camera
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          # Keep only the latest confirmed scan.  Old buffered hits otherwise
          # re-mark a person after newer finite rays have cleared that space.
          # This is NOT a TTL for out-of-view obstacle cells: those remain
          # until a valid clearing observation or an explicit map reset.
          observation_persistence: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.25
          obstacle_max_range: 2.5
          obstacle_min_range: 0.25
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 15.0 
        # 与局部地图统一为 0.25 m；车体半径仍为 0.175 m。
        # 仅统一软代价覆盖范围，不改变致命/内切碰撞边界。
        inflation_radius: 0.25

# =====================================================================
# 🧿 局部代价地图
# =====================================================================
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: False
      transform_tolerance: 1.0  
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.175     
      plugins: ["lidar_obstacle_layer", "camera_obstacle_layer", "inflation_layer"]
      lidar_obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        combination_method: 1
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.15
          obstacle_max_range: 2.5
          obstacle_min_range: 0.15
      camera_obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        combination_method: 1
        observation_sources: camera camera_clear
        camera_clear:
          topic: /scan_camera_clear
          data_type: "LaserScan"
          clearing: True
          marking: False
          inf_is_valid: False
          observation_persistence: 0.0
          max_obstacle_height: 2.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.25
        camera:
          topic: /scan_camera
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          # Keep only the latest confirmed scan; old hits must not fight
          # current clearing rays.  Invalid/no-depth rays remain unknown,
          # never asserted free (inf_is_valid stays at its false default).
          observation_persistence: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.25
          obstacle_max_range: 2.5
          obstacle_min_range: 0.25
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 20.0 
        # 实车 A/B 采用 0.25 m，保留车体外 75 mm 的局部软代价带；
        # robot_radius 和独立 Collision Monitor 的 0.19 m 半径保持不变。
        inflation_radius: 0.25
