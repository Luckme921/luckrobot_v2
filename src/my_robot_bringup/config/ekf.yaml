ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    two_d_mode: true
    publish_tf: true
    
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # ============================================
    # 1. 轮式里程计输入
    # ============================================
    odom0: /wheel/odom
    # 矩阵含义: [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
    # 轮子提供: X速度 (vx), Z角速度 (vyaw)
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false

    # ============================================
    # 2. IMU 传感器输入
    # ============================================
    imu0: /imu/data
    # 🚨【核心修复】：这里将第6个值 (绝对Yaw) 改为了 false！
    # 仅保留第12个值 (角速度 vyaw)。这样 EKF 初始永远是 0 度，只靠角速度积分！
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true