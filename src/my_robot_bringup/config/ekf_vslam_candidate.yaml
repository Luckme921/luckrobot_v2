ekf_filter_node_vslam_candidate:
  ros__parameters:
    # Observation-only A/B filter. It must never publish the production TF.
    frequency: 50.0
    sensor_timeout: 0.20
    two_d_mode: true
    publish_tf: false
    publish_acceleration: false
    print_diagnostics: true
    reset_on_time_jump: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Wheel encoders provide forward velocity only. Do not fuse wheel vyaw:
    # a physically stalled differential turn can still advance both motor
    # encoders and would otherwise corrupt this observation-only filter too.
    odom0: /wheel/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # Preserve the current stable IMU yaw-rate input.
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 20

    # Only fuse the guarded stream. The guard pairs Isaac ROS' separate pose
    # covariance message, rejects tracking jumps, and re-anchors recovery into
    # the production odom frame. Never fuse raw cuVSLAM odometry here.
    odom1: /visual_slam/tracking/odometry_validated
    odom1_config: [true,  true,  false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_differential: false
    odom1_relative: false
    odom1_queue_size: 20
    odom1_pose_rejection_threshold: 3.0
