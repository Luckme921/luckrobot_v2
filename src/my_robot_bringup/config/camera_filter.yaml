camera_scan_filter_chain:
  ros__parameters:
    filter1:
      name: depth_speckle_filter
      type: laser_filters/LaserScanSpeckleFilter
      params:
        # Humble 的 laser_filters 2.0.x 没有独立的
        # LaserScanRadiusOutlierFilter 插件。使用已发布的 SpeckleFilter，
        # 要求至少 3 个连续深度束在 0.3 m 范围内保持一致。
        filter_type: 0
        max_range: 3.0
        max_range_difference: 0.3
        filter_window: 3
